name: test-html2pdf-bullseye
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    container: debian:bullseye-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract and run
        run: |
          apt-get update
          apt-get install -y --no-install-recommends fontconfig ca-certificates

          mkdir -p fonts/
          cp -rL /etc/fonts/* fonts/

          tar -czhvf fonts.tar.gz fonts/


          tar -xzf plutobook-linux-x64.tar.gz
          chmod +x plutobook-linux-x64/tools/html2pdf
          ./plutobook-linux-x64/tools/html2pdf https://en.wikipedia.org/wiki/Bjarne_Stroustrup hello.pdf

      - name: Upload fonts.tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: fonts
          path: fonts.tar.gz
          if-no-files-found: error
          
      - name: Upload hello.pdf
        uses: actions/upload-artifact@v4
        with:
          name: hello-pdf
          path: hello.pdf
          if-no-files-found: error
